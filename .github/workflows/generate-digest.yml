name: Generate Operating Brief

on:
  workflow_dispatch:
    inputs:
      script:
        description: Python digest script to run
        required: true
        type: choice
        options:
          - daily_digest.py
          - markets_digest.py
          - sports_digest.py
          - paddock_digest.py
      flag:
        description: CLI flag to pass to the script
        required: true
        type: choice
        options:
          - --preview
          - --send
          - --ingest

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        run: python3 "${{ inputs.script }}" "${{ inputs.flag }}"
